<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ฝากเงินที่ไหนดี</title>
<style>
:root{
  --bg:#f3faf5; --card:#ffffff; --ink:#1c2b24; --muted:#62756c; --line:#e2eee6;
  --green:#14a254; --green-ink:#ffffff; --green-soft:#e5f7ec;
  --sun:#ffb423; --sun-soft:#fff5d9; --sky:#2f8fde; --sky-soft:#e6f2fc;
  --tax:#e06a3a; --warn:#b26a00; --warn-soft:#fff1d6;
  --bar:#9fdcb7; --bar-top:#14a254; --brand:#c2185b;
  --hero:linear-gradient(135deg,#e3f8eb 0%,#fff6dc 100%);
  --shadow:0 4px 18px rgba(20,90,50,.07);
  --page:
    radial-gradient(ellipse 60% 45% at 0% 0%, #c9f2db 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 8%, #ffeab0 0%, transparent 70%),
    radial-gradient(ellipse 55% 45% at 100% 100%, #cfe8ff 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 0% 95%, #ffe0cc 0%, transparent 70%),
    linear-gradient(180deg,#f4fcf7 0%,#f8fbff 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1712; --card:#17221c; --ink:#e9f3ed; --muted:#9fb3a8; --line:#25352c;
    --green:#3fd07f; --green-ink:#08160e; --green-soft:#16301f;
    --sun:#ffc44d; --sun-soft:#33290f; --sky:#62b2f0; --sky-soft:#142a3b;
    --tax:#f3926a; --warn:#f5c066; --warn-soft:#352a12;
    --bar:#2c7a4d; --bar-top:#3fd07f; --brand:#ff7aac;
    --hero:linear-gradient(135deg,#163222 0%,#2e2810 100%); --shadow:none;
    --page:
      radial-gradient(ellipse 60% 45% at 0% 0%, #123524 0%, transparent 70%),
      radial-gradient(ellipse 50% 40% at 100% 8%, #2f2711 0%, transparent 70%),
      radial-gradient(ellipse 55% 45% at 100% 100%, #11283d 0%, transparent 70%),
      #0f1712;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1712; --card:#17221c; --ink:#e9f3ed; --muted:#9fb3a8; --line:#25352c;
  --green:#3fd07f; --green-ink:#08160e; --green-soft:#16301f;
  --sun:#ffc44d; --sun-soft:#33290f; --sky:#62b2f0; --sky-soft:#142a3b;
  --tax:#f3926a; --warn:#f5c066; --warn-soft:#352a12;
  --bar:#2c7a4d; --bar-top:#3fd07f; --brand:#ff7aac;
  --hero:linear-gradient(135deg,#163222 0%,#2e2810 100%); --shadow:none;
  --page:
    radial-gradient(ellipse 60% 45% at 0% 0%, #123524 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 8%, #2f2711 0%, transparent 70%),
    radial-gradient(ellipse 55% 45% at 100% 100%, #11283d 0%, transparent 70%),
    #0f1712;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--page);background-color:var(--bg);background-attachment:fixed;color:var(--ink);
  font-family:"Sarabun","Leelawadee UI","Noto Sans Thai","Segoe UI","Tahoma",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 56px}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{font-family:inherit;font-size:.88rem;font-weight:700;border:0;background:transparent;color:var(--muted);
  padding:5px 14px;border-radius:999px;cursor:pointer}
.lang button.on{background:var(--green);color:var(--green-ink)}
header{text-align:center;margin-bottom:22px}
header .logo{font-size:2.6rem;line-height:1}
h1{font-size:1.9rem;margin:6px 0 4px}
h2{font-size:1.25rem;margin:0 0 14px}
.sub{color:var(--muted);margin:0}
.badges{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.pill{display:inline-block;background:var(--green-soft);color:var(--green);font-weight:700;font-size:.85rem;
  padding:3px 12px;border-radius:999px}
.byline{display:inline-block;background:var(--card);color:var(--brand);font-weight:800;font-size:1.05rem;
  padding:6px 20px;border-radius:999px;box-shadow:0 3px 14px rgba(194,24,91,.14);letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.lbl{display:block;font-weight:700;margin-bottom:8px}
.field{position:relative}
.field input{width:100%;padding:13px 82px 13px 16px;font-size:1.5rem;font-weight:700;border:2px solid var(--line);
  border-radius:14px;background:var(--bg);color:var(--ink);font-family:inherit;font-variant-numeric:tabular-nums}
.field input:focus{outline:none;border-color:var(--green);background:var(--card)}
.field .unit{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-family:inherit;font-size:.9rem;padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--green)}
.chip.on{background:var(--green);border-color:var(--green);color:var(--green-ink);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:.95rem}
.opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
.opts input{width:18px;height:18px;accent-color:var(--green)}
.hero{position:relative;background:var(--hero);border-radius:22px;padding:26px 24px;margin-bottom:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.sticker{position:absolute;top:-14px;right:18px;background:var(--sun);color:#3a2600;font-weight:800;font-size:.95rem;
  padding:6px 14px;border-radius:999px;transform:rotate(4deg);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hero .who{font-size:.95rem;color:var(--muted)}
.hero .bank{font-size:1.5rem;font-weight:800;margin:2px 0 14px}
.hero .bank small{font-weight:600;color:var(--muted);font-size:1rem}
.hero .row{display:flex;flex-wrap:wrap;gap:12px 36px;align-items:flex-end}
.hero .big{font-size:2.3rem;font-weight:800;color:var(--green);line-height:1.1;font-variant-numeric:tabular-nums}
.hero .mid{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.hero .cap{font-size:.9rem;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
@media (min-width:960px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .ic{font-size:1.5rem;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.kpi .k{color:var(--muted);font-size:.92rem}
.kpi .v{font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .d{color:var(--muted);font-size:.82rem}
.ic.g{background:var(--green-soft)} .ic.s{background:var(--sun-soft)} .ic.b{background:var(--sky-soft)} .ic.t{background:var(--warn-soft)}
.v.green{color:var(--green)} .v.tax{color:var(--tax)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.head h2{margin:0}
.btn{font-family:inherit;font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--green)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.85rem;color:var(--muted);font-weight:600;white-space:nowrap}
.num{text-align:right;white-space:nowrap}
tr.first td{background:var(--sun-soft)}
tr.sel td{background:var(--green-soft)}
.rank{font-size:1.35rem;display:inline-block;min-width:34px;text-align:center}
.rank.n{font-size:.95rem;font-weight:700;color:var(--muted)}
.bname{font-weight:700}
.pname{color:var(--muted);font-size:.92rem}
.money{font-weight:800;font-size:1.08rem;color:var(--green)}
.sm{font-size:.82rem;color:var(--muted)}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.mini{font-family:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:999px;padding:2px 10px;cursor:pointer}
.mini:hover{border-color:var(--green)}
tr.info td{background:var(--bg);font-size:.88rem;line-height:1.65;padding:12px 16px}
tr.info a{color:var(--sky)}
.warnline{color:var(--warn)}
#chart{overflow-x:auto}
#chart svg{width:100%;min-width:700px;height:auto;display:block}
#chart text{font-family:inherit;fill:var(--ink)}
.yr td,.yr th{padding:9px 10px}
.yr tr.total td{font-weight:800;border-bottom:none}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tip{background:var(--bg);border-radius:14px;padding:12px 14px;font-size:.92rem}
.tip b{display:block;margin-bottom:2px}
details.more summary{cursor:pointer;font-weight:700;font-size:1.05rem;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾";color:var(--muted)}
details.more[open] summary::after{content:" ▴"}
.foot{font-size:.88rem;color:var(--muted)}
.foot ul,.foot ol{padding-left:20px;margin:8px 0}
.foot a{color:var(--sky)}
.note{text-align:center;font-size:.85rem;color:var(--muted);margin-top:8px}
.credit{text-align:center;margin-top:18px}
@media (max-width:640px){
  body{font-size:16px} h1{font-size:1.55rem} .card{padding:16px} .hero .big{font-size:1.9rem}
  .hide-sm{display:none}
}
@media print{.no-print{display:none}.card,.kpi,.hero{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar no-print">
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="th">ไทย</button><button data-lang="en">EN</button>
    </div>
  </div>

  <header>
    <div class="logo">🐷💰</div>
    <h1 data-i="title"></h1>
    <p class="sub" data-i="sub"></p>
    <div class="badges">
      <span class="pill" id="checked"></span>
      <span class="byline">by Nok SAKUNA</span>
    </div>
  </header>

  <div class="card">
    <div class="inputs">
      <div>
        <label class="lbl" for="amount" data-i="amountLbl"></label>
        <div class="field"><input id="amount" type="text" inputmode="numeric" value="1,000,000" autocomplete="off"><span class="unit" data-i="baht"></span></div>
        <div class="chips" id="amountChips"></div>
      </div>
      <div>
        <label class="lbl" for="months" data-i="monthsLbl"></label>
        <div class="field"><input id="months" type="text" inputmode="numeric" value="12" autocomplete="off"><span class="unit" data-i="monthUnit"></span></div>
        <div class="chips" id="monthChips"></div>
      </div>
    </div>
    <div class="opts">
      <label><input id="bonus" type="checkbox"><span data-i="bonusLbl"></span></label>
      <label><input id="verifiedOnly" type="checkbox"><span data-i="verLbl"></span></label>
    </div>
  </div>

  <div class="hero" id="hero"></div>
  <section class="kpis" id="kpis"></section>

  <div class="card">
    <h2><span data-i="chartTitle"></span> <span class="sm" id="chartSub"></span></h2>
    <div id="chart"></div>
  </div>

  <div class="card">
    <div class="head">
      <h2 data-i="tableTitle"></h2>
      <button id="toggleAll" class="btn no-print"></button>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-i="thRank"></th><th data-i="thAcct"></th>
          <th class="num" data-i="thMax"></th>
          <th class="num" data-i="thNet"></th>
          <th class="hide-sm" data-i="thDate"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card" id="yearCard">
    <h2 id="yearTitle"></h2>
    <div class="tablewrap">
      <table class="yr">
        <thead><tr><th data-i="yPeriod"></th><th class="num" data-i="yStart"></th><th class="num" data-i="yInt"></th><th class="num" data-i="yTax"></th><th class="num" data-i="yEnd"></th></tr></thead>
        <tbody id="ybody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2 data-i="tipsTitle"></h2>
    <div class="tips">
      <div class="tip" data-i="tip1"></div>
      <div class="tip" data-i="tip2"></div>
      <div class="tip" data-i="tip3"></div>
      <div class="tip" data-i="tip4"></div>
    </div>
  </div>

  <div class="card foot">
    <details class="more">
      <summary data-i="moreTitle"></summary>
      <ul data-i="method"></ul>
      <ol id="sources"></ol>
    </details>
  </div>
  <p class="note" data-i="note"></p>
  <div class="credit"><span class="byline">by Nok SAKUNA</span></div>
</div>

// ================= การคำนวณ =================
function tierInterest(bal, tiers){
  let r=0, prev=0;
  for(const [to,rate] of tiers){ if(bal<=prev) break; r+=(Math.min(bal,to)-prev)*rate/100; prev=to; }
  return r;
}
function monthInterest(p, bal, i, bonus){
  if(p.kept){ return Math.min(bal,2e6)*((i%24)<18?0.0125:0.0135)/12; }
  return tierInterest(bal, (bonus && p.bonusTiers) ? p.bonusTiers : p.tiers)/12;
}
function maxRate(p, bonus){
  if(p.kept) return 1.35;
  return Math.max(...((bonus && p.bonusTiers) ? p.bonusTiers : p.tiers).map(t=>t[1]));
}
// ≤12 เดือน ไม่ทบต้น · >12 เดือน ทบต้นทุกครบ 12 เดือน (หลังหักภาษี)
function simulate(p, a, m, bonus){
  let bal=a, yrInt=0, yrStart=a, yrFrom=1, gross=0, tax=0; const years=[];
  for(let i=0;i<m;i++){
    yrInt += monthInterest(p, bal, i, bonus);
    if((i+1)%12===0 || i===m-1){
      const t = yrInt>20000 ? yrInt*0.15 : 0;
      years.push({from:yrFrom, to:i+1, start:yrStart, int:yrInt, tax:t, end:yrStart+yrInt-t});
      gross+=yrInt; tax+=t; bal=yrStart+yrInt-t; yrStart=bal; yrInt=0; yrFrom=i+2;
    }
  }
  let annual=0; for(let i=0;i<12;i++) annual+=monthInterest(p,a,i,bonus);
  return {annual, gross, tax, net:gross-tax, final:a+gross-tax, eff:a>0?annual/a*100:0, years, max:maxRate(p,bonus)};
}

const pct=n=>fmt2(n)+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const MEDAL=["🥇","🥈","🥉"];
function period(m){ const y=Math.floor(m/12), r=m%12; if(m<12) return T[lang].m(m); return r?T[lang].ym(y,r):T[lang].y(y); }
function compactBaht(n){ return n>=1e6 ? T[lang].million((n/1e6).toLocaleString("en-US")) : fmt0(n); }

// ================= UI =================
const $amount=document.getElementById("amount"), $months=document.getElementById("months"),
      $bonus=document.getElementById("bonus"), $ver=document.getElementById("verifiedOnly"),
      $toggle=document.getElementById("toggleAll");
let showAll=false, selected=null, openInfo=null;
const AMOUNTS=[10000,100000,500000,1000000,2000000,5000000,10000000];
const MONTHS=[3,6,12,24,36,60];

function applyStatic(){
  document.documentElement.lang = lang;
  document.title = t("docTitle");
  document.querySelectorAll("[data-i]").forEach(el=>{ el.innerHTML = t(el.dataset.i); });
  document.getElementById("checked").textContent = t("checked");
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  document.getElementById("amountChips").innerHTML = AMOUNTS.map(v=>`<button class="chip" data-a="${v}">${compactBaht(v)}</button>`).join("");
  document.getElementById("monthChips").innerHTML = MONTHS.map(v=>`<button class="chip" data-m="${v}">${period(v)}</button>`).join("");
  document.getElementById("sources").innerHTML = SRC_KEYS.map(k=>
    `<li><a href="${SRC[k][2]}" target="_blank" rel="noopener">${esc(lang==="en"?SRC[k][1]:SRC[k][0])}</a></li>`).join("")
    + `<li>${t("compiled")}</li>`;
}
document.querySelector(".lang").addEventListener("click",e=>{
  const b=e.target.closest("[data-lang]"); if(!b) return;
  lang=b.dataset.lang; try{ localStorage.setItem("lang",lang); }catch(err){}
  applyStatic(); render();
});

document.getElementById("amountChips").addEventListener("click",e=>{const b=e.target.closest("[data-a]"); if(!b) return;
  $amount.value=Number(b.dataset.a).toLocaleString("en-US"); render();});
document.getElementById("monthChips").addEventListener("click",e=>{const b=e.target.closest("[data-m]"); if(!b) return;
  $months.value=b.dataset.m; render();});
const readAmount=()=>Math.max(0,Number(($amount.value||"").replace(/[^\d]/g,""))||0);
const readMonths=()=>Math.min(360,Math.max(1,Math.round(Number(($months.value||"").replace(/[^\d]/g,""))||1)));
$amount.addEventListener("input",()=>{
  const pos=$amount.value.length-$amount.selectionStart, raw=$amount.value.replace(/[^\d]/g,"").slice(0,12);
  $amount.value = raw ? Number(raw).toLocaleString("en-US") : "";
  const np=Math.max(0,$amount.value.length-pos); $amount.setSelectionRange(np,np); render();
});
$months.addEventListener("input",()=>{ $months.value=$months.value.replace(/[^\d]/g,"").slice(0,3); render(); });
[$bonus,$ver].forEach(el=>el.addEventListener("change",render));
$toggle.addEventListener("click",()=>{showAll=!showAll; render();});
document.getElementById("tbody").addEventListener("click",e=>{
  const s=e.target.closest("[data-sel]"), f=e.target.closest("[data-info]");
  if(s){ selected=s.dataset.sel; render(); document.getElementById("yearCard").scrollIntoView({behavior:"smooth",block:"start"}); }
  if(f){ openInfo = openInfo===f.dataset.info ? null : f.dataset.info; render(); }
});

function render(){
  const a=readAmount(), m=readMonths(), bonus=$bonus.checked, comp=m>12, X=T[lang];
  document.querySelectorAll("#amountChips .chip").forEach(c=>c.classList.toggle("on",Number(c.dataset.a)===a));
  document.querySelectorAll("#monthChips .chip").forEach(c=>c.classList.toggle("on",Number(c.dataset.m)===m));

  const rows = PRODUCTS.filter(p=>!$ver.checked||p.verified)
    .map(p=>({p, r:simulate(p,a,m,bonus), id:p.bank+"|"+p.name}))
    .sort((x,y)=>y.r.net-x.r.net || y.r.max-x.r.max);
  const top=rows.slice(0,10), list=showAll?rows:top;
  $toggle.textContent = showAll ? X.top10 : X.showAll(rows.length);

  if(!top.length || a<=0){
    document.getElementById("hero").innerHTML=`<div class="bank">${X.empty}</div>`;
    ["kpis","tbody","chart","ybody"].forEach(id=>document.getElementById(id).innerHTML=""); return;
  }
  const b=top[0];

  document.getElementById("hero").innerHTML = `
    <span class="sticker">${X.best}</span>
    <div class="who">${X.deposit(fmt0(a), period(m))} ${comp?X.comp:''}</div>
    <div class="bank">${esc(L(b.p,"bank"))} <small>${esc(L(b.p,"name"))}</small>
      ${b.p.verified?'':` <span class="tag warn">${X.check}</span>`}</div>
    <div class="row">
      <div><div class="cap">${X.earned}</div><div class="big">+${fmt2(b.r.net)} ฿</div></div>
      <div><div class="cap">${X.payout}</div><div class="mid">${fmt2(b.r.final)} ฿</div></div>
    </div>`;

  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="ic g">📈</div><div class="k">${X.kYear}</div>
      <div class="v">${fmt2(b.r.annual)} ฿</div><div class="d">${X.kAvg(pct(b.r.eff))}</div></div>
    <div class="kpi"><div class="ic b">💰</div><div class="k">${X.kTotal(period(m))}</div>
      <div class="v">${fmt2(b.r.gross)} ฿</div><div class="d">${X.beforeTax}</div></div>
    <div class="kpi"><div class="ic t">🧾</div><div class="k">${X.kTax}</div>
      <div class="v ${b.r.tax?'tax':''}">${fmt2(b.r.tax)} ฿</div><div class="d">${b.r.tax?X.taxed:X.taxFree}</div></div>
    <div class="kpi"><div class="ic s">🎉</div><div class="k">${X.kNet}</div>
      <div class="v green">${fmt2(b.r.net)} ฿</div><div class="d">${X.afterTax}</div></div>`;

  if(!selected || !rows.find(x=>x.id===selected)) selected=b.id;
  document.getElementById("tbody").innerHTML = list.map((x,i)=>{
    const {p,r}=x, open=openInfo===x.id, note=L(p,"note");
    const srcs=p.src.map(k=>`<a href="${SRC[k][2]}" target="_blank" rel="noopener">${esc(lang==="en"?SRC[k][1]:SRC[k][0])}</a>`).join(" · ");
    return `<tr class="${i===0?'first':''} ${x.id===selected&&i!==0?'sel':''}">
      <td>${i<3?`<span class="rank">${MEDAL[i]}</span>`:`<span class="rank n">${i+1}</span>`}</td>
      <td><div class="bname">${esc(L(p,"bank"))}</div><div class="pname">${esc(L(p,"name"))}
        <span class="tag ${p.verified?'ok':'warn'}">${p.verified?X.verified:X.check}</span></div>
        <div class="acts no-print"><button class="mini" data-info="${esc(x.id)}">${open?X.hide:X.details}</button>
        <button class="mini" data-sel="${esc(x.id)}">${X.byYear}</button></div></td>
      <td class="num">${pct(r.max)}</td>
      <td class="num"><span class="money">${fmt2(r.net)}</span>${r.tax?`<div class="sm">${X.taxLine(fmt2(r.tax))}</div>`:''}</td>
      <td class="hide-sm">${esc(L(p,"date"))}</td></tr>
      ${open?`<tr class="info"><td></td><td colspan="4">
        📌 ${esc(L(p,"rateText"))}<br>
        ${note?`<span class="warnline">${esc(note)}</span><br>`:''}
        📅 ${esc(L(p,"announced"))}<br>
        🔗 ${srcs}</td></tr>`:''}`;
  }).join("");

  drawChart(top, m);
  renderYears(rows.find(x=>x.id===selected), a, m);
}

function renderYears(x, a, m){
  const X=T[lang];
  document.getElementById("yearTitle").innerHTML = `${X.yearTitle} <span class="sm">· ${esc(L(x.p,"bank"))} ${esc(L(x.p,"name"))}</span>`;
  document.getElementById("ybody").innerHTML = x.r.years.map((y,i)=>`<tr>
      <td>${m>12?X.yearN(i+1):period(m)} <span class="sm">${X.monthsRange(y.from,y.to)}</span></td>
      <td class="num">${fmt2(y.start)}</td><td class="num" style="color:var(--green)">+${fmt2(y.int)}</td>
      <td class="num sm">${y.tax?'-'+fmt2(y.tax):'-'}</td><td class="num"><b>${fmt2(y.end)}</b></td></tr>`).join("")
    + (x.r.years.length>1?`<tr class="total"><td>${X.total}</td><td class="num">${fmt2(a)}</td><td class="num" style="color:var(--green)">+${fmt2(x.r.gross)}</td>
       <td class="num">${x.r.tax?'-'+fmt2(x.r.tax):'-'}</td><td class="num">${fmt2(x.r.final)}</td></tr>`:'');
}

function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))), f=v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function drawChart(top, m){
  document.getElementById("chartSub").textContent = T[lang].chartSub(period(m));
  const W=960, H=430, L0=64, R=12, Tp=48, B=70, cw=W-L0-R, ch=H-Tp-B;
  const max=niceMax(Math.max(1,...top.map(x=>x.r.net)));
  const slot=cw/top.length, bw=Math.min(60, slot*0.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${T[lang].chartAria}">
    <defs><linearGradient id="gTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sun)"/><stop offset="1" style="stop-color:var(--bar-top)"/></linearGradient></defs>`;
  for(let g=0; g<=4; g++){
    const y=Tp+ch-ch*g/4;
    s+=`<line x1="${L0}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--line)" ${g?'stroke-dasharray="3 6"':''}/>`;
    s+=`<text x="${L0-8}" y="${y+4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${fmt0(max*g/4)}</text>`;
  }
  top.forEach((x,i)=>{
    const cx=L0+slot*i+slot/2, h=Math.max(3,ch*x.r.net/max), y=Tp+ch-h;
    const full=L(x.p,"bank")+" "+L(x.p,"name");
    s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="8" fill="${i===0?'url(#gTop)':'var(--bar)'}"><title>${esc(full)}: ${fmt2(x.r.net)} ${T[lang].thb}</title></rect>`;
    s+=`<text x="${cx}" y="${y-8}" text-anchor="middle" font-size="13" font-weight="700">${fmt0(x.r.net)}</text>`;
    if(i<3) s+=`<text x="${cx}" y="${y-28}" text-anchor="middle" font-size="20">${MEDAL[i]}</text>`;
    const nm=L(x.p,"name"), pn=nm.length>12?nm.slice(0,11)+"…":nm;
    s+=`<text x="${cx}" y="${Tp+ch+22}" text-anchor="middle" font-size="13" font-weight="700">${esc(L(x.p,"short"))}</text>`;
    s+=`<text x="${cx}" y="${Tp+ch+40}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${esc(pn)}</text>`;
  });
  document.getElementById("chart").innerHTML = s+`</svg>`;
}

applyStatic();
render();
</script>
</body>
</html>
